<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#102c36">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Straightforward Navigation, home">Straightforward<span class="brand-dot" aria-hidden="true">.</span></a>
        <nav aria-label="Main navigation">
          <a href="{{ '/#features' | relative_url }}">Features</a>
          <a href="{{ '/#approach' | relative_url }}">Our approach</a>
          <a href="{{ '/#updates' | relative_url }}">Updates</a>
        </nav>
      </div>
    </header>
    <main id="main" class="container" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="container">
        <p>Straightforward Navigation · An iPhone app in development.</p>
        <p>This site describes a beta product. Location and map information should be checked against conditions on the ground.</p>
      </div>
    </footer>
  </body>
</html>
